[package]
name = "monocode"
version.workspace = true
edition.workspace = true
description = "MonoCode — one UI for every agent harness"
authors = ["Nick"]
repository = "https://github.com/hardbeat920/monocode"
homepage = "https://usemono.dev"
license.workspace = true

[lib]
name = "monocode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
open = "5.4.1"
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
monocode-platform = { path = "../crates/platform" }
monocode-process = { path = "../crates/process" }
monocode-git = { path = "../crates/git" }
monocode-store = { path = "../crates/store" }
monocode-terminal = { path = "../crates/terminal" }
monocode-integrations = { path = "../crates/integrations" }
monocode-remote = { path = "../crates/remote" }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
portable-pty = { version = "0.9", path = "../vendor/portable-pty" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSButton", "NSColor", "NSControl", "NSDockTile", "NSGraphics", "NSImage", "NSLayoutAnchor", "NSLayoutConstraint", "NSMenu", "NSMenuItem", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSUserInterfaceItemIdentification", "NSView", "NSVisualEffectView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSError", "NSString"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"

# The Tauri app has its own workspace and lockfile until cutover. Upstream GTK
# crates pin toml_datetime 0.6.3, which cannot share a lockfile with GPUI's
# cbindgen. The native crates live in the root workspace.
[workspace]
members = ["."]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
