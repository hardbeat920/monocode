[package]
name = "monocode-engine"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false
description = "App state and behavior as GPUI entities, runnable with or without a window"

[features]
# Every package except runtime sits behind a feature, so an agent can build
# its own module with --no-default-features --features <name>.
default = ["submit", "attention", "side_threads", "orchestration", "workspace", "projects", "history", "automations", "inbox", "remote"]
# Runtime itself does not use the harness, process, layout, or settings
# crates, so a half-finished change there cannot break a runtime-only build.
# Each package feature turns on the ones packages may need.
package-deps = ["dep:monocode-harness", "dep:monocode-process", "dep:monocode-layout", "dep:monocode-settings"]
# submit: link previews (integrations), URL parsing (url), and pasted
# attachment bytes (base64).
submit = ["package-deps", "dep:monocode-integrations", "dep:url", "dep:base64"]
attention = ["package-deps", "dep:monocode-integrations", "dep:monocode-platform", "dep:chrono", "dep:url"]
# side_threads: reuses submit's handoff and second-opinion models and its
# submit action, and attention's live agents port.
side_threads = ["package-deps", "submit", "attention"]
# orchestration: managed turns and Stop go through submit; pending worker
# input reads attention's approval toast; the app API reads history's
# folders and notes and projects' worktrees.
orchestration = ["package-deps", "submit", "attention", "history", "projects"]
workspace = ["package-deps", "dep:monocode-terminal", "dep:monocode-terminal-view"]
projects = ["package-deps"]
history = ["package-deps", "dep:chrono"]
# automations: launches go through submit; reminders read attention's
# notification rules; session folders (history) and recents (projects);
# local schedule times (chrono).
automations = ["package-deps", "submit", "attention", "history", "projects", "dep:chrono"]
# inbox: tracker clients (integrations), ISO timestamps and local midnight
# (chrono), and URL parsing (url).
inbox = ["package-deps", "dep:monocode-integrations", "dep:chrono", "dep:url"]
remote = ["package-deps"]
# `runtime::testing`: the fake store backend and workspace hooks, for other
# crates' tests.
test-support = ["gpui/test-support"]

[dependencies]
gpui.workspace = true
monocode-core.workspace = true
monocode-harness = { workspace = true, optional = true }
monocode-process = { workspace = true, optional = true }
monocode-store.workspace = true
monocode-git.workspace = true
monocode-layout = { workspace = true, optional = true }
monocode-settings = { workspace = true, optional = true }
# The workspace package runs PTYs and adapts them to the terminal view.
monocode-terminal = { workspace = true, optional = true }
monocode-terminal-view = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
async-channel.workspace = true
smol.workspace = true
parking_lot.workspace = true
uuid.workspace = true
log.workspace = true
anyhow.workspace = true
regex.workspace = true
# attention: rate limit fetches, native notifications, and local time for
# usage limit resets.
monocode-integrations = { workspace = true, optional = true }
monocode-platform = { workspace = true, optional = true }
chrono = { version = "0.4.45", optional = true, default-features = false, features = ["clock", "std"] }
url = { workspace = true, optional = true }
# submit: pasted attachment bytes.
base64 = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
