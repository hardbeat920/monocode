[package]
name = "monocode-git"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
monocode-platform = { path = "../platform" }
monocode-process = { path = "../process" }
base64.workspace = true
open = "5.4.1"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
# The worktree removal tests open a real session database.
monocode-store = { path = "../store" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
