[package]
name = "monocode-editor"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[dependencies]
gpui.workspace = true
gpui-base.workspace = true
gpui-component = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-sql",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
anyhow.workspace = true
regex.workspace = true
similar = "2.7"
lsp-types = "0.97"
tree-sitter = "0.26"
hayro = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
