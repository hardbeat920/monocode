[package]
name = "monocode-editor"
version.workspace = true
edition = "2024"
license.workspace = true
publish = false

[features]
test-support = []

[dependencies]
gpui.workspace = true
gpui-base.workspace = true
gpui-component = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-sql",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
anyhow.workspace = true
regress.workspace = true
unicode-normalization.workspace = true
similar = "2.7"
lsp-types = "0.97"
tree-sitter = "0.26"
tree-sitter-containerfile = "0.9.2"
tree-sitter-dart = "0.2.0"
tree-sitter-objc = "3.0.2"
tree-sitter-perl = "1.1.2"
tree-sitter-powershell = "0.26.4"
tree-sitter-r = "1.3.0"
tree-sitter-xml = "0.7.0"
hayro = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
avif-decode = { version = "3.0.0", default-features = false }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
