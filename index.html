<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/monocode.png" />
    <title>MonoCode</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var hue = localStorage.getItem("monocode.themeHue");
          var sat = localStorage.getItem("monocode.themeSaturation");
          var darkLightness = localStorage.getItem(
            "monocode.themeDarkLightness",
          );
          var opacity = localStorage.getItem("monocode.sidebarOpacity");
          if (hue != null) {
            var h = Math.max(0, Math.min(360, Number(hue) || 0));
            root.style.setProperty("--theme-hue", String(h));
          }
          if (sat != null) {
            var s = Math.max(0, Math.min(100, Number(sat) || 0));
            root.style.setProperty("--theme-saturation", s + "%");
          }
          if (darkLightness != null) {
            var l = Math.max(0, Math.min(30, Number(darkLightness) || 0));
            root.style.setProperty("--theme-dark-lightness", l + "%");
          }
          if (opacity != null) {
            var o = Math.max(0.15, Math.min(1, Number(opacity) || 0.85));
            root.style.setProperty("--sidebar-opacity", String(o));
          }
          var scheme = localStorage.getItem("monocode.colorScheme");
          if (scheme === "system") {
            scheme = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (scheme === "light") {
            root.classList.add("theme-light");
          }
          var bodyGlass = localStorage.getItem("monocode.bodyGlass");
          if (bodyGlass == null || bodyGlass === "1" || bodyGlass === "true") {
            root.classList.add("glass-body");
          }
          var isMac =
            typeof navigator !== "undefined" &&
            /Mac|iPhone|iPad/.test(navigator.platform);
          if (isMac) {
            root.classList.add("is-mac");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        --theme-hue: 240;
        --theme-saturation: 0%;
        --theme-dark-lightness: 9%;
        --sidebar-opacity: 0.85;
        --background-lightness: var(--theme-dark-lightness);
        --color-background-base: hsl(
          var(--theme-hue) var(--theme-saturation) var(--background-lightness)
        );
      }

      html.theme-light {
        --background-lightness: 97%;
      }

      html,
      body,
      #boot-splash {
        margin: 0;
        background: var(--color-background-base);
      }

      /* Opaque cover until React paints. The logo is in HTML so it is
         visible during the Dock bounce, before the bundle runs. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transition: opacity 0.16s ease;
      }

      #boot-splash.boot-splash-out {
        opacity: 0;
      }

      #boot-splash img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="/monocode.png" alt="" />
    </div>
    <div id="root"></div>
    <script>
      // Boot probe: framework-independent proof of which stage stalls.
      // vanilla JS only — it must run even if every module fails to load.
      (function () {
        var el = null;
        function mark(text, color) {
          if (!el) {
            el = document.createElement("div");
            el.style.cssText =
              "position:fixed;left:8px;bottom:8px;z-index:99999;padding:4px 8px;" +
              "border-radius:6px;background:rgba(0,0,0,.7);color:" + color +
              ";font:10px/1.4 ui-monospace,monospace;pointer-events:none;";
            (document.body || document.documentElement).append(el);
          }
          el.textContent = text;
        }
        window.__monoProbe = mark;
        mark("js: dom", "#9ca3af");
        window.addEventListener("DOMContentLoaded", function () {
          mark("js: dom-content-loaded", "#fbbf24");
        });
        window.addEventListener("load", function () {
          mark("js: window-load", "#34d399");
          setTimeout(function () {
            if (!document.getElementById("root") || !document.getElementById("root").childElementCount) {
              mark("js: loaded, react never mounted (module stall?)", "#f87171");
            } else {
              mark("", "#34d399");
              if (el) el.remove();
            }
          }, 4000);
        });
        setTimeout(function () {
          // React may mount before `window.load` when a slow resource delays
          // it; a mounted app is not a module stall.
          if (document.getElementById("root")?.childElementCount) return;
          mark(el && el.textContent.indexOf("dom-content") >= 0
            ? "js: scripts evaluating… (module stall)"
            : "js: no dom-content-loaded after 8s", "#f87171");
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
