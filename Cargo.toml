[workspace]
resolver = "2"
members = ["src-tauri", "crates/skills"]
exclude = ["vendor/portable-pty"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
