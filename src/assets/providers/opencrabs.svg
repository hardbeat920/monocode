    <ellipse cx="6.3" cy="21.8" rx="3.1" ry="1.3" transform="rotate(8 6.3 21.8)"/>
    <ellipse cx="7.0" cy="24.2" rx="3.1" ry="1.3" transform="rotate(-16 7.0 24.2)"/>
    <ellipse cx="22.1" cy="19.2" rx="3.1" ry="1.3" transform="rotate(-28 22.1 19.2)"/>
    <ellipse cx="22.7" cy="21.8" rx="3.1" ry="1.3" transform="rotate(-8 22.7 21.8)"/>
    <ellipse cx="22.0" cy="24.2" rx="3.1" ry="1.3" transform="rotate(16 22.0 24.2)"/>
  </g>
