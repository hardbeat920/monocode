    <ellipse cx="9.9" cy="13.6" rx="3.2" ry="1.5" transform="rotate(38 9.9 13.6)"/>
    <ellipse cx="19.1" cy="13.6" rx="3.2" ry="1.5" transform="rotate(-38 19.1 13.6)"/>
    <!-- Body -->
    <ellipse cx="14.5" cy="17.5" rx="6.8" ry="5"/>
